{% extends "base.html" %}{% block content %}
<header class="page-head"><div><span class="eyebrow">Administration</span><h1>Exporter le corpus</h1><p class="muted">Téléchargez les WAV normalisés et leurs métadonnées dans une archive vérifiée.</p></div></header>
<section class="card"><form method="post" action="/admin/export/corpus">
  <div class="field"><label for="mode">Mode</label><select id="mode" name="mode"><option value="work">Travail — enregistrements correspondant aux filtres</option><option value="benchmark">Benchmark — uniquement les enregistrements vérifiés et exploitables</option></select></div>
  <p class="muted">Le mode benchmark exclut les prises non validées, sans transcription ou sans WAV conforme.</p>
  <div class="form-grid"><div class="field"><label for="condition">Condition</label><select id="condition" name="condition"><option value="">Toutes</option><option>CLEAN</option><option>NOISY</option></select></div><div class="field"><label for="status">Statut</label><select id="status" name="status"><option value="">Tous</option><option>RECORDED</option><option>TRANSCRIBED</option><option>NEEDS_REVIEW</option><option>VERIFIED</option><option>REJECTED</option></select></div><div class="field"><label for="verification_status">Vérification</label><select id="verification_status" name="verification_status"><option value="">Toutes</option><option>PENDING</option><option>VERIFIED</option><option>NEEDS_REVIEW</option><option>REJECTED</option></select></div><div class="field"><label for="participant">Participant</label><input id="participant" name="participant" placeholder="Code exact"></div><div class="field"><label for="intent">Intention</label><input id="intent" name="intent"></div><div class="field"><label for="has_transcription">Transcription</label><select id="has_transcription" name="has_transcription"><option value="">Toutes</option><option value="true">Présente</option><option value="false">Absente</option></select></div><div class="field"><label for="date_min">Date minimale</label><input id="date_min" name="date_min" type="date"></div><div class="field"><label for="date_max">Date maximale</label><input id="date_max" name="date_max" type="date"></div></div>
  <input type="hidden" name="strict" value="true"><button class="btn" type="submit">Télécharger l’archive ZIP</button>
</form></section>{% endblock %}
